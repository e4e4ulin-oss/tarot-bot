<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Таро</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <img src="assets/emblem.webp" alt="" width="38" height="38">
    <div>
      <h1 id="brand">Таро</h1>
      <p id="brand-sub">расклады и разборы</p>
    </div>
  </header>

  <!-- Карта дня -->
  <section class="screen on" id="s-daily" data-tab="daily">
    <h2>Карта дня</h2>
    <p class="lead">Одна карта — настроение и задача на сегодня.</p>
    <div id="daily-body"><div class="skeleton"></div></div>
  </section>

  <!-- Расклад -->
  <section class="screen" id="s-spread" data-tab="spread">
    <div class="hero">
      <img src="assets/spreads-header.webp" alt="">
      <div class="over">Расклад</div>
    </div>
    <p class="lead">Выберите раскладку — дальше можно задать вопрос.</p>
    <div id="spread-body"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <!-- Авторский разбор -->
  <section class="screen" id="s-author" data-tab="author">
    <h2>Авторский разбор</h2>
    <p class="lead" id="author-lead">Живой разбор от таролога, а не от модели.</p>
    <div id="author-body"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <!-- Колода -->
  <section class="screen" id="s-deck" data-tab="deck"></section>

  <!-- Кабинет -->
  <section class="screen" id="s-profile" data-tab="profile">
    <h2>Кабинет</h2>
    <p class="lead">Ваши данные и история раскладов.</p>
    <div id="profile-body"><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>
</div>

<nav class="tabbar">
  <button class="tab on" data-go="daily"><svg><use href="assets/icons.svg#i-sun"></use></svg>Карта дня</button>
  <button class="tab" data-go="spread"><svg><use href="assets/icons.svg#i-cards"></use></svg>Расклад</button>
  <button class="tab" data-go="author"><svg><use href="assets/icons.svg#i-quill"></use></svg>Разбор</button>
  <button class="tab" data-go="deck"><svg><use href="assets/icons.svg#i-zodiac"></use></svg>Колода</button>
  <button class="tab" data-go="profile"><svg><use href="assets/icons.svg#i-moon"></use></svg>Кабинет</button>
</nav>

<script src="deck.js"></script>
<script src="app.js"></script>
</body>
</html>
