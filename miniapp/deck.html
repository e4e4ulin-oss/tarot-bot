<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Колода</title>
<!-- Колода переехала в приложение и стала его вкладкой: внутри Telegram
     подпись приходит в адресе, и уход на отдельную страницу её затирал —
     экран открывался, а данные за ним не грузились. Страница осталась
     ради старых ссылок и просто передаёт на нужную вкладку. -->
<script>
  location.replace(`index.html${location.search}#deck`);
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <p class="lead" style="padding-top:40px">
    Колода открывается в приложении.
    <a href="index.html#deck" style="color:var(--gold)">Перейти</a>
  </p>
</div>
</body>
</html>
