<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Иконки разделов. Линия одной толщины, без заливки: цвет задаётся
       снаружи через currentColor, поэтому активная вкладка просто меняет цвет. -->

  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6"/>
    <path d="M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/>
  </symbol>

  <symbol id="i-cards" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="4" width="10" height="14" rx="1.6"/>
    <path d="M7.2 6.1 4.6 7.1a1.4 1.4 0 0 0-.8 1.8l3.4 9.2"/>
    <path d="M14 8.6v4.8M11.6 11h4.8"/>
  </symbol>

  <symbol id="i-quill" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20c0-5 2.4-9.3 6.4-11.6C13.6 6.6 17 6 20 6c0 3.4-.8 6.8-2.8 9.4C15 18.4 11 20 7 20z"/>
    <path d="M4 20 11.4 12.6"/>
    <path d="M12.4 13.6h3.4"/>
  </symbol>

  <symbol id="i-zodiac" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.4"/>
    <circle cx="12" cy="12" r="3.4"/>
    <path d="M12 3.6v2M12 18.4v2M3.6 12h2M18.4 12h2"/>
    <path d="M6 6l1.5 1.5M16.5 16.5 18 18M18 6l-1.5 1.5M7.5 16.5 6 18"/>
  </symbol>

  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 14.6A8 8 0 0 1 9.4 5a8.4 8.4 0 1 0 9.6 9.6z"/>
    <path d="M17.4 4.6v2.8M16 6h2.8"/>
  </symbol>

  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 5 7.5 12l7 7"/>
  </symbol>

  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round">
    <path d="M6 6l12 12M18 6 6 18"/>
  </symbol>
</svg>
