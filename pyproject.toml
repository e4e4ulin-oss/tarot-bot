[project]
name = "tarot-bot"
version = "1.0.0"
description = "Telegram-бот для раскладов Таро: авто-разбор через Grok и авторский разбор от Анастасии"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]
